#
# The account authn-revokd runs as. Installed as
# /usr/lib/sysusers.d/authn-revokd.conf (or /etc/sysusers.d/authn-revokd.conf)
# and applied with `systemd-sysusers`.
#
# A static account, not DynamicUser=: authn-revokd refuses a state directory
# owned by anyone but its own uid or root, and the state must keep ordering
# the next list across restarts and upgrades (PROTOCOL.md rule 2). With a
# dynamic uid the state would live under /var/lib/private, which is 0700
# root: a TLS server running as its own user could not read the CRL written
# beside it, and the uid owning the files would change meaning over time.
#
#Type Name         ID Description                               Home                 Shell
u     authn-revokd -  "go-authn revocation list agent"          /var/lib/authn-revokd -
